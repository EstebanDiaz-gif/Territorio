<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Territorio</title>
<meta name="description" content="Gestión de campaña: cabezas, encargados de circuito, dirigentes y movilizadores con su gente y dónde vota cada uno.">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Public+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"><div class="login"><div class="muted">Cargando…</div></div></div>
<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => {
        r.update();
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update(); });
      }).catch(() => {});
    });
    // Cuando hay una versión nueva, se recarga sola una vez
    let recargando = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (recargando || !navigator.serviceWorker.controller) return;
      recargando = true;
      location.reload();
    });
  }
</script>
</body>
</html>
